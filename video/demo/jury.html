<!doctype html>
<html>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Jury demo, < 3 minutes. Webcam parts are placeholders; the voice-over is recorded separately
// (video/demo/SCRIPT.md has the lines and timecodes). The live demo is a recording of the real
// web app (video/demo/capture.cjs, frames.json).
const W = 1920, H = 1080;
const C = { mag: "#ca026a", deep: "#7a0f55", tint: "#fdf0f7", line: "#eee6ec", ink: "#1d1320", ink2: "#4a3f4c", muted: "#6e6470", grey: "#faf6f9", amber: "#b25d00", amberBg: "#fff4e5", green: "#1e5b37", greenBg: "#e9f5ee", blue: "#1d4a85", blueBg: "#eaf1fb" };
const cv = document.getElementById("c");
const g = cv.getContext("2d");
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const font = (w, s, fam = "Outfit") => `${w} ${s}px ${fam}`;
const ONE_LINER = "Hearth notices when your days drift from your usual pattern, and reminds you what helps, in your own words, on your own device.";
const GITHUB = "github.com/thomasdevving/BuildHybridAI-2026";
const SITE = "hearth-ecru-sigma.vercel.app";
const SCIENCE_URL = "hearth-ecru-sigma.vercel.app/science";

function text(str, x, y, f, color, align = "left") { g.font = f; g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic"; g.fillText(str, x, y); }
function wrap(str, x, y, maxW, f, color, lh, align = "left") {
  g.font = f; g.fillStyle = color; g.textAlign = align;
  const words = str.split(" "); let line = ""; let yy = y; const lines = [];
  for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  for (const l of lines) { g.fillText(l, x, yy); yy += lh; }
  return yy - lh;
}
function rr(x, y, w, h, r, fill, stroke, lw = 2, dash) {
  g.beginPath(); g.roundRect(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.save(); if (dash) g.setLineDash(dash); g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); g.restore(); }
}
function fade(k, fn) { if (k <= 0) return; g.save(); g.globalAlpha = Math.min(1, k); fn(); g.restore(); }
function bg(flower = 0.22, which = "R") {
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  const img = which === "R" ? FLOWER : FLOWER_L; if (!img) return;
  const fw = 1920, fh = fw * (img.height / img.width);
  g.save(); g.globalAlpha = flower; g.drawImage(img, 0, (H - fh) / 2, fw, fh); g.restore();
}
function logo(x, y, s = 40, withWord = true) {
  g.drawImage(LOGO, x, y - s * 0.8, s, s);
  if (withWord) text("Hearth", x + s + 10, y, font(800, s * 0.8, "Syne"), C.mag);
}
function label(str, x, y, color = C.mag) { text(str.toUpperCase(), x, y, font(700, 22, "Syne"), color); }

// ---------- webcam placeholder ----------
function webcam(x, y, w, h, title, lines, small = false) {
  rr(x, y, w, h, small ? 18 : 28, "#241a27");
  rr(x + 10, y + 10, w - 20, h - 20, small ? 12 : 20, null, "rgba(255,255,255,.35)", 2, [12, 10]);
  const cx = x + w / 2, cy = y + h / 2 - (small ? 18 : 70);
  const s = small ? 0.55 : 1.2;
  g.save(); g.translate(cx, cy); g.scale(s, s);
  rr(-60, -38, 90, 76, 14, null, "rgba(255,255,255,.8)", 5);
  g.beginPath(); g.moveTo(34, -12); g.lineTo(66, -30); g.lineTo(66, 30); g.lineTo(34, 12); g.closePath(); g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 5; g.stroke();
  g.restore();
  text(title, cx, cy + (small ? 50 : 120), font(700, small ? 22 : 40, "Syne"), "#fff", "center");
  if (!small) lines.forEach((l, i) => text(l, cx, cy + 180 + i * 42, font(400, 28), "rgba(255,255,255,.75)", "center"));
  else if (lines[0]) text(lines[0], cx, cy + 80, font(400, 17), "rgba(255,255,255,.7)", "center");
}
function timecode(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, "0")}`; }

// ---------- timeline ----------
// Live demo: ranges of the recording (seconds) with chapter captions; `hold` freezes a frame.
const DEMO = [
  { from: 0.3, to: 6.9, n: 1, title: "Sam writes the plan in their own words", sub: "Typed or spoken. It never leaves the device." },
  { from: 6.9, to: 8.4, n: 2, title: "Gemini Nano turns it into a plan, on the device", sub: "Signs to watch, check-in questions, what helps." },
  { hold: 8.4, dur: 4.2, n: 2, title: "Gemini Nano turns it into a plan, on the device", sub: "Signs to watch, check-in questions, what helps.", catch: true },
  { from: 8.4, to: 15.4, n: 3, title: "Sam stays in control", sub: "Untick anything that is not right. Then save." },
  { from: 19.6, to: 24.0, n: 4, title: "Day 61: “I’m in Spain this week”", sub: "The time machine replays Sam’s simulated sensor data." },
  { from: 24.0, to: 28.0, n: 4, title: "One question, and Sam decides", sub: "Gemini Nano reads the note; nothing changes until Sam says yes." },
  { from: 28.0, to: 30.9, n: 5, title: "Day 109", sub: "Sam’s days have been drifting for six days." },
  { from: 30.9, to: 37.6, n: 5, title: "Hearth notices", sub: "Later sleep, higher resting heart rate: computed by the engine, not the model." },
  { from: 37.6, to: 51.2, speed: 2.2, n: 6, title: "A 20-second check-in", sub: "Gemini Nano writes the opening line; every number in it is checked." },
  { from: 51.2, to: 58.4, speed: 1.4, n: 7, title: "Sam’s own plan opens", sub: "What Sam said helps, in Sam’s own words." },
  { from: 58.4, to: 64.4, speed: 1.3, n: 8, title: "Nothing private left the device", sub: "The privacy ledger lists every model call and exactly what was sent." },
];
let demoLen = 0; for (const s of DEMO) { s.start = demoLen; s.len = s.hold !== undefined ? s.dur : (s.to - s.from) / (s.speed || 1); demoLen += s.len; }

const T = {};
let cur = 0;
const seg = (name, len) => { T[name] = [cur, cur + len]; cur += len; };
seg("hook", 22); seg("problem", 8); seg("oneliner", 8); seg("demo", demoLen); seg("watches", 15); seg("theory", 16); seg("arch", 15); seg("control", 12); seg("numbers", 13); seg("close", 11);
const TOTAL = cur;

// ---------- sections ----------
function hook(t, k) {
  bg(0.12, "L");
  webcam(160, 90, 1600, 900, "WEBCAM  ·  0:00–0:22", ["Your opening: a personal moment, or someone you know,", "when the drift started long before anyone noticed.", "Replace this placeholder with your clip."]);
  fade(ease((k - 0.15) / 0.1), () => { rr(60, 950, 560, 70, 18, "rgba(255,255,255,.95)"); logo(90, 997, 36); text("#BuildHybridAI 2026", 330, 995, font(500, 26), C.ink2); });
}
function problem(t, k) {
  bg(0.18, "R");
  label("Today", 160, 220, C.amber);
  const lines = ["A relapse-prevention plan on paper.", "An appointment every few weeks.", "In between, the drift goes unnoticed."];
  lines.forEach((l, i) => fade(ease((t - T.problem[0] - 0.3 - i * 1.2) / 0.6), () => text(l, 160, 330 + i * 90, font(700, 60, "Syne"), i === 2 ? C.amber : C.ink)));
  fade(ease((t - T.problem[0] - 4.2) / 0.6), () => {
    rr(160, 640, 980, 170, 26, C.grey, C.line, 2);
    const n = Math.min(39, Math.floor(ease((t - T.problem[0] - 4.2) / 2.5) * 39));
    text(String(n), 210, 760, font(800, 110, "Syne"), C.ink);
    text("days since Sam’s days began to drift.", 380, 720, font(500, 34), C.ink2);
    text("Nobody has noticed yet.", 380, 772, font(700, 34), C.amber);
  });
  text("Sam is a simulated person from Hearth’s replay engine.", 160, 900, font(400, 22), C.muted);
}
function oneliner(t, k) {
  bg(0.3, "R");
  fade(ease((t - T.oneliner[0]) / 0.8), () => { logo(160, 300, 64); });
  fade(ease((t - T.oneliner[0] - 0.6) / 0.9), () => wrap(ONE_LINER, 160, 430, 1250, font(700, 62, "Syne"), C.ink, 80));
}

function phone(img, x, y, h) {
  const w = h * (390 / 844) + 28;
  rr(x, y, w, h + 28, 56, "#1d1320");
  g.save(); g.beginPath(); g.roundRect(x + 14, y + 14, w - 28, h, 44); g.clip();
  g.fillStyle = "#fff"; g.fillRect(x + 14, y + 14, w - 28, h);
  if (img) g.drawImage(img, x + 14, y + 14, w - 28, h);
  g.restore();
  return w;
}
let FRAMES = null, frameImg = null, frameFile = "";
async function frameAt(rec) {
  let lo = 0, hi = FRAMES.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (FRAMES[m].t <= rec) lo = m; else hi = m - 1; }
  const f = FRAMES[lo].file;
  if (f !== frameFile) { const im = new Image(); im.src = `frames/${f}`; await im.decode(); frameImg = im; frameFile = f; }
  return frameImg;
}
async function demo(t) {
  const local = t - T.demo[0];
  let s = DEMO[DEMO.length - 1];
  for (const x of DEMO) if (local >= x.start && local < x.start + x.len) { s = x; break; }
  const rec = s.hold !== undefined ? s.hold : s.from + (local - s.start) * (s.speed || 1);
  const img = await frameAt(rec);
  bg(0.16, "L");
  // phone
  const ph = 960, pw = ph * (390 / 844) + 28;
  phone(img, 1230, (H - ph - 28) / 2, ph);
  // chapter
  const firstOfChapter = DEMO.find((x) => x.n === s.n);
  const kc = ease((local - firstOfChapter.start) / 0.6);
  label(`Live demo  ·  ${s.n} / 8`, 140, 200);
  fade(Math.max(kc, s === firstOfChapter ? kc : 1), () => {
    const y = wrap(s.title, 140, 290, 960, font(700, 62, "Syne"), C.ink, 74);
    wrap(s.sub, 140, y + 70, 900, font(400, 32), C.ink2, 44);
  });
  if (s.catch) {
    const k = ease((local - s.start) / 0.5);
    fade(k, () => {
      rr(140, 560, 960, 230, 26, C.tint, C.mag, 3);
      label("Caught and checked", 180, 615);
      wrap("The model suggested a sign Sam never wrote: “I stop walking my dog”. Code checks every quote against Sam’s own text, so it was left out, and Hearth says so.", 180, 670, 880, font(500, 30), C.ink, 42);
    });
  }
  // draft label + webcam picture-in-picture
  rr(140, 92, 640, 48, 24, C.amberBg, "#f0c890", 2);
  text("DRAFT: stand-in model. Re-record with Gemini Nano in Chrome", 162, 124, font(600, 20), C.amber);
  webcam(140, 820, 360, 202, "WEBCAM (optional)", ["small, while you narrate"], true);
}

function watches(t) {
  bg(0.0);
  const s = t - T.watches[0];
  label("What Hearth watches, and why", 120, 110);
  text("Every signal that research links to harder periods", 120, 175, font(700, 48, "Syne"), C.ink);
  const G = [
    { name: "Sleep", src: "watch, or phone stillness", sig: [["↕", "sleep length"], ["→", "later (or earlier) sleep"], ["↓", "regular sleep times"]], why: "Insomnia about doubles the odds of later depression.", cite: "Baglioni 2011, 21 studies" },
    { name: "Activity", src: "phone steps", sig: [["↓", "steps"], ["↓", "active hours"], ["↓", "walking pace"]], why: "Active people have lower odds of later depression (OR 0.83).", cite: "Schuch 2018, 49 cohorts" },
    { name: "Daily rhythm", src: "hourly steps, 7 days", sig: [["↓", "steadiness of the day"], ["↑", "stop-and-start activity"], ["↓", "day–night difference"]], why: "A flatter day–night rhythm goes with more depression and bipolar disorder.", cite: "Lyall 2018, 91,105 people" },
    { name: "Heart", src: "watch", sig: [["↓", "heart rate variability"], ["↑", "resting heart rate"]], why: "Lower HRV in depression, more so when severe; resting heart rate tracks severity.", cite: "Kemp 2010; Siddi 2023" },
    { name: "Places", src: "iPhone location, stays on the phone", sig: [["↑", "time at home"], ["↓", "places, variety, area"], ["↓", "usual routine"], ["↓", "a place you name (gym)"]], why: "Regular movement goes with fewer symptoms (r = −0.63); GPS changes came first.", cite: "Saeb 2015; Meyerhoff 2021" },
    { name: "Phone use", src: "off by default", sig: [["↑", "screen time"], ["↑", "use at night"], ["↓", "time in messaging apps"]], why: "More phone time went with higher symptom scores (r = 0.54).", cite: "Saeb 2015" },
    { name: "Check-ins and words", src: "you, a few taps", sig: [["↑", "feeling down"], ["↓", "enjoyment, energy"], ["•", "language: shown, never scored"]], why: "Low check-ins can prompt a short questionnaire. Language predicts depression months ahead but tracks change poorly, so it is never scored.", cite: "Eichstaedt 2018" },
  ];
  const cw = 405, ch = 395, gap = 20;
  G.forEach((c, i) => fade(ease((s - 0.3 - i * 0.45) / 0.5), () => {
    const x = 120 + (i % 4) * (cw + gap), y = 220 + Math.floor(i / 4) * (ch + gap);
    const off = c.name === "Phone use";
    rr(x, y, cw, ch, 22, off ? C.grey : "#fff", C.line, 2);
    text(c.name, x + 26, y + 50, font(700, 30, "Syne"), off ? C.muted : C.ink);
    text(c.src, x + 26, y + 80, font(500, 18), C.muted);
    c.sig.forEach(([a, l], k) => {
      const yy = y + 122 + k * 34;
      rr(x + 26, yy - 22, 30, 30, 15, off ? "#eee" : C.tint);
      text(a, x + 41, yy, "700 19px 'DejaVu Sans', sans-serif", off ? C.muted : C.mag, "center");
      text(l, x + 68, yy, font(500, 22), off ? C.muted : C.ink);
    });
    const wy = y + 122 + c.sig.length * 34 + 14;
    wrap(c.why, x + 26, wy, cw - 52, font(400, 19), C.ink2, 25);
    text(c.cite, x + 26, y + ch - 22, font(500, 16), C.muted);
  }));
  // 8th tile: how they are used
  fade(ease((s - 3.8) / 0.6), () => {
    const x = 120 + 3 * (cw + gap), y = 220 + ch + gap;
    rr(x, y, cw, ch, 22, C.tint, "#f3c1dc", 2);
    text("How they count", x + 26, y + 50, font(700, 30, "Syne"), C.deep);
    const lines = ["Only against your own usual days, never other people.", "Only the direction that matters for each signal.", "Signs you name yourself count double.", "A holiday or illness you confirm is set aside."];
    let yy = y + 100;
    lines.forEach((l) => { yy = wrap(l, x + 26, yy, cw - 52, font(500, 21), C.ink, 28) + 44; });
  });
  fade(ease((s - 6) / 0.6), () => text("Read more: " + SCIENCE_URL, 120, 1055, font(700, 24), C.mag));
}

function theory(t) {
  bg(0.0);
  const s = t - T.theory[0];
  label("What counts as a drift, and what Hearth does then", 120, 120);
  text("Not one bad day: a change that lasts", 120, 190, font(700, 52, "Syne"), C.ink);
  // left: Sam's own index, days 84-116, against Sam's own usual range
  const x0 = 120, y0 = 250, w = 900, h = 400, d0 = 84, d1 = 116;
  const days = SAM.days.filter((d) => d.day >= d0 && d.day <= d1);
  const X = (day) => x0 + 60 + ((day - d0) / (d1 - d0)) * (w - 330);
  const Y = (v) => y0 + h - 40 - (Math.min(v, 1.3) / 1.3) * (h - 70);
  const reveal = d0 + (d1 - d0) * ease((s - 0.3) / 6);
  fade(ease(s / 0.5), () => {
    rr(x0, y0, w, h, 24, "#fff", C.line, 2);
    text("Sam\u2019s change index, compared with Sam\u2019s own usual days", x0 + 30, y0 + 44, font(600, 22), C.ink2);
    // usual range
    const ucl = days[0].UCL;
    g.save(); g.setLineDash([10, 8]); g.strokeStyle = C.ink2; g.lineWidth = 2; g.beginPath(); g.moveTo(X(d0), Y(ucl)); g.lineTo(X(d1), Y(ucl)); g.stroke(); g.restore();
    text("top of Sam\u2019s usual range", X(d0) + 6, Y(ucl) - 10, font(500, 18), C.ink2);
    const vis = days.filter((d) => d.day <= reveal);
    g.strokeStyle = "rgba(110,100,112,.55)"; g.lineWidth = 1.5; g.beginPath(); vis.forEach((d, k) => (k ? g.lineTo(X(d.day), Y(d.D)) : g.moveTo(X(d.day), Y(d.D)))); g.stroke();
    vis.forEach((d) => { g.beginPath(); g.arc(X(d.day), Y(d.D), 3.5, 0, Math.PI * 2); g.fillStyle = "rgba(110,100,112,.8)"; g.fill(); });
    g.strokeStyle = C.mag; g.lineWidth = 4; g.beginPath(); vis.forEach((d, k) => (k ? g.lineTo(X(d.day), Y(d.S)) : g.moveTo(X(d.day), Y(d.S)))); g.stroke();
    text("one day", x0 + w - 250, y0 + h - 14, font(500, 17), C.muted);
    g.beginPath(); g.arc(x0 + w - 270, y0 + h - 20, 4, 0, Math.PI * 2); g.fillStyle = "rgba(110,100,112,.8)"; g.fill();
    g.fillStyle = C.mag; g.fillRect(x0 + w - 170, y0 + h - 22, 26, 4); text("trend", x0 + w - 136, y0 + h - 14, font(500, 17), C.muted);
    if (reveal >= 107) fade(ease((reveal - 107) / 1.5), () => {
      const px = X(107), py = Y(0.56);
      g.beginPath(); g.arc(px, py, 9, 0, Math.PI * 2); g.strokeStyle = C.ink2; g.lineWidth = 2; g.stroke();
      text("day 107: one bad day,", px - 18, py - 46, font(600, 19), C.ink2, "right");
      text("trend stays inside: no alarm", px - 18, py - 22, font(600, 19), C.ink2, "right");
    });
    if (reveal >= 109) fade(ease((reveal - 109) / 1.5), () => {
      const day = days.find((d) => d.day === 109), px = X(109), py = Y(day.S);
      g.beginPath(); g.arc(px, py, 10, 0, Math.PI * 2); g.fillStyle = C.mag; g.fill();
      text("day 109: the trend crosses", px + 18, py + 52, font(700, 19), C.mag);
      text("\u2192 \u201cChanged\u201d", px + 18, py + 76, font(700, 19), C.mag);
    });
  });
  // what moved
  fade(ease((s - 4.5) / 0.6), () => {
    text("What moved, against Sam\u2019s own usual days", x0, 712, font(600, 24), C.ink);
    const chips = ["Sleep 1 h later", "Resting heart rate up", "Fewer gym visits", "More time at home"];
    let cx = x0;
    chips.forEach((c) => { g.font = font(600, 22); const cw = g.measureText(c).width + 40; rr(cx, 735, cw, 50, 25, C.tint, "#f3c1dc", 1.5); text(c, cx + 20, 768, font(600, 22), C.deep); cx += cw + 12; });
    text("Several of Sam\u2019s signals, for several days. Three are signs Sam wrote down.", x0, 830, font(400, 22), C.ink2);
  });
  // right: how Hearth helps
  const steps = [
    ["Asks, briefly", "A 20-second check-in that says what changed."],
    ["Opens Sam\u2019s own plan", "\u201cCall my sister\u201d \u00b7 \u201cA walk in the morning\u201d"],
    ["Checks if it lasts", "Only then a short validated questionnaire, word for word."],
    ["Support, if Sam wants", "A summary to share with a GP or therapist. 988 always one tap away."],
  ];
  fade(ease((s - 6.5) / 0.6), () => text("Then Hearth helps", 1080, 300, font(700, 36, "Syne"), C.ink));
  steps.forEach(([a, b], k) => fade(ease((s - 7 - k * 0.9) / 0.6), () => {
    const y = 340 + k * 135;
    g.beginPath(); g.arc(1102, y + 32, 22, 0, Math.PI * 2); g.fillStyle = C.mag; g.fill();
    text(String(k + 1), 1102, y + 41, font(800, 24, "Syne"), "#fff", "center");
    text(a, 1145, y + 40, font(700, 28), C.ink);
    wrap(b, 1145, y + 78, 640, font(400, 23), C.ink2, 31);
  }));
  fade(ease((s - 11) / 0.7), () => {
    g.font = font(700, 28);
    const l2 = "Read more: " + SCIENCE_URL;
    const bw = g.measureText(l2).width + 60;
    rr(120, 900, bw, 70, 35, C.mag);
    text(l2, 150, 945, font(700, 28), "#fff");
    text("The signals, every formula and every source.", 120 + bw + 28, 945, font(400, 24), C.ink2);
  });
}

function box(x, y, w, h, title, body, tone = "plain", tag) {
  const fill = tone === "device" ? C.greenBg : tone === "cloud" ? C.blueBg : tone === "engine" ? C.tint : "#fff";
  const stroke = tone === "device" ? "#a8d5b9" : tone === "cloud" ? "#aecaee" : tone === "engine" ? "#f3c1dc" : C.line;
  rr(x, y, w, h, 20, fill, stroke, 2);
  text(title, x + 24, y + 46, font(700, 28, "Syne"), C.ink);
  if (tag) { g.font = font(600, 17); const tw = g.measureText(tag).width + 24; rr(x + w - tw - 18, y + 20, tw, 32, 16, "#fff", stroke, 1.5); text(tag, x + w - tw / 2 - 18, y + 42, font(600, 17), C.ink2, "center"); }
  wrap(body, x + 24, y + 88, w - 48, font(400, 23), C.ink2, 32);
}
function arch(t) {
  bg(0.0);
  const s = t - T.arch[0];
  label("Architecture", 120, 110);
  text("One SDK, two places to run: Firebase AI Logic hybrid inference", 120, 170, font(700, 44, "Syne"), C.ink);
  fade(ease(s / 0.6), () => {
    rr(100, 220, 1100, 800, 30, null, C.line, 2);
    text("On your phone or in Chrome", 130, 265, font(700, 26), C.ink2);

// ---------- render ----------
async function render(t) {
  if (t < T.problem[0]) hook(t, t / T.hook[1]);
  else if (t < T.oneliner[0]) problem(t);
  else if (t < T.demo[0]) oneliner(t);
  else if (t < T.watches[0]) await demo(t);
  else if (t < T.theory[0]) watches(t);
  else if (t < T.arch[0]) theory(t);
  else if (t < T.control[0]) arch(t);
  else if (t < T.numbers[0]) control(t);
  else if (t < T.close[0]) numbers(t);
  else close(t);
  // cross-fade from white at each section start
  for (const k of Object.keys(T)) {
    const a = T[k][0]; if (a === 0) continue;
    if (t >= a && t < a + 0.45) { g.save(); g.globalAlpha = 1 - ease((t - a) / 0.45); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.restore(); }
  }
  // timecode for editing (top right, small)
  text(timecode(t), W - 30, 40, font(500, 18), "rgba(110,100,112,.55)", "right");
}
