<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Hearth for clinicians · thumbnail</title>
<style>
  @font-face { font-family: "Syne"; src: url("../../node_modules/@fontsource-variable/syne/files/syne-latin-wght-normal.woff2") format("woff2"); font-weight: 400 800; }
  @font-face { font-family: "Outfit"; src: url("../../node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; }
  .t { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #fff; font-family: "Outfit", sans-serif; color: #1d1320; }
  .flower { position: absolute; inset: 0; background: url("../../apps/web/src/assets/flower-right.webp") 70% center / cover no-repeat; opacity: 0.8; }
  .wash { position: absolute; inset: 0; background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,.94) 46%, rgba(255,255,255,0) 66%); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 12px; font: 800 34px "Syne"; color: #ca026a; }
  .brand img { width: 44px; height: 44px; }
  .eyebrow { margin-top: 30px; font: 700 22px "Syne"; letter-spacing: .08em; text-transform: uppercase; color: #ca026a; }
  h1 { margin: 10px 0 0; font: 800 64px/1.02 "Syne"; letter-spacing: -0.02em; }
  h1 span { color: #ca026a; }
  .sub { margin-top: 22px; font: 500 26px/1.3 "Outfit"; color: #4a3f4c; max-width: 560px; }
  .pill { margin-top: 26px; align-self: flex-start; padding: 12px 22px; border-radius: 999px; background: #1d1320; color: #fff; font: 700 24px "Outfit"; }
  .phone { position: absolute; right: 110px; top: 50%; transform: translateY(-50%); width: 280px; padding: 11px; border-radius: 48px; background: #1d1320; box-shadow: 0 40px 80px -20px rgba(122,15,85,.45); }
  .phone img { display: block; width: 100%; border-radius: 38px; }
  .chip { position: absolute; right: 70px; top: 548px; padding: 14px 20px; border-radius: 18px; background: #ca026a; color: #fff; font: 700 22px "Outfit"; box-shadow: 0 20px 40px -14px rgba(122,15,85,.6); }
  .chip small { display: block; font: 500 17px "Outfit"; opacity: .9; margin-top: 2px; }
</style>
</head>
<body>
<div class="t" id="t">
  <div class="flower"></div>
  <div class="wash"></div>
  <div class="copy">
    <div class="brand"><img src="../../apps/web/src/assets/hearth-logo.png" alt="" />Hearth</div>
    <div class="eyebrow">For clinicians</div>
    <h1>Relapse prevention, in <span>their own words</span></h1>
    <div class="sub">How the plan is made, what the app does with it, and what you get.</div>
    <div class="pill">3 min overview</div>
  </div>
  <div class="phone"><img src="assets/ios-cards.jpg" alt="" /></div>
  <div class="chip">Every card keeps their exact words<small>Left out: 1 suggestion they never wrote</small></div>
</div>
</body>
</html>
